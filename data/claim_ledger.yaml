- claim_id: trajectory-ness-net-rotation-turns
  kind: number
  value: -4.583662361046586
  note: "Window-dependent total winding over horizon T = DT*STEPS = 12; grows with T. Not intrinsic \u2014 see trajectory-ness-rotation-rate."
  source: src/trajectories.py net_rotation()/2pi for the NESS run (annotated on figure panel b)
  source_tier: derived
  freshness: active
  artifact_path: output/figures/worked_trajectories.png
- claim_id: trajectory-ness-rotation-rate
  kind: number
  value: -0.3819718634205488
  note: "Intrinsic IC-independent rotation rate = -omega*precision/(2pi) turns per unit time; analytic d\u03B8/dt\
    \ = -omega*precision. Exactly 0 at equilibrium. Verified in tests/test_trajectories.py::test_ness_rotation_rate_is_intrinsic\
    \ (with omega=5, precision=1.3)."
  source: src/trajectories.py net_rotation over horizon / (2pi * T); analytic -omega*precision/(2pi) with omega=2.4,
    precision=1
  source_tier: derived
  freshness: active
  artifact_path: output/figures/worked_trajectories.png
