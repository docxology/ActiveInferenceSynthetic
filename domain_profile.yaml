domain: active_inference
display_name: Active Inference Synthetic Overview
required_packages:
  - numpy
  - matplotlib
  - pytest
preferred_outputs:
  - pdf
  - html
  - docx
  - epub
validation_gates:
  - experiment_method_design
  - artifact_manifest
  - evidence_grounding
  - render_validation
  - publication_readiness
figure_types:
  - free_energy_flow
  - belief_update
  - worked_trajectories
  - expected_free_energy
  - markov_blanket
  - steady_state_current
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs and scholarly Active Inference, Free Energy Principle, and Bayesian-mechanics references."
review_gates:
  - experiment_method_design
  - render_validation
  - publication_readiness
artifact_expectations:
  - output/figures/active_inference_overview.png
  - output/figures/belief_update.png
  - output/figures/worked_trajectories.png
  - output/figures/expected_free_energy.png
  - output/figures/markov_blanket.png
  - output/figures/steady_state_current.png
  - output/pdf/ActiveInferenceSynthetic_combined.pdf
benchmark_rubric:
  name: code-research-readiness
  dimensions:
    - name: output_validity
      weight: 1.0
    - name: reproducibility_bundle
      weight: 1.0
    - name: artifact_manifest
      weight: 1.0
    - name: evidence_grounding
      weight: 2.0
    - name: render_success
      weight: 1.0
    - name: publication_readiness
      weight: 1.0
llm_prompt_guidance: "Use tested numerical cores, generated figures, Lean proofs, and manuscript citations as evidence; do not invent numeric results."
