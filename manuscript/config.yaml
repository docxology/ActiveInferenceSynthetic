# Active Inference -- A Synthetic Overview
# Project metadata consumed by the rendering + publishing infrastructure.
# Loaded by `infrastructure/rendering/_pdf_combined_renderer.py` (manuscript
# metadata) and `infrastructure.publishing.extract_publication_metadata`.

paper:
  title: "Active Inference -- A Synthetic Overview"
  subtitle: "An applicable introduction across equilibrium and far-from-equilibrium systems"
  version: "0.1.0"
  date: "2026-06-28"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true
  - name: "Alexandra Mikhailova"
    email: "alexandra@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: false

publication:
  github_repository: ""

keywords:
  - "active inference"
  - "free energy principle"
  - "Bayesian mechanics"
  - "non-equilibrium steady state"
  - "variational inference"
  - "self-organization"

metadata:
  license: "CC-BY-4.0"
  language: "en"

# Lightweight first-iteration render: PDF + HTML only.
render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false

# Steganography off for this early educational draft.
steganography:
  enabled: false

# No LLM stages for this overview draft.
llm:
  reviews:
    enabled: false
  translations:
    enabled: false

# Zero-tolerance test gate (inherited template policy).
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0
