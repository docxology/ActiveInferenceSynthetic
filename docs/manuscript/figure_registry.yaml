figures:
- id: fig:graphical-abstract
  file: output/figures/graphical_abstract.png
  section: cover
  caption: A shared stationary density, distinct probability currents, and separate specification, numerical, formal and interpretation layers.
  alt_text: Matched Gaussian contours compare zero equilibrium current with stationary rotational current; an inference-action loop and GNN, Synthetic and FEP_Formal evidence map appear below.
  builder: src/figures/graphical_abstract.py
  script: scripts/generate_all_figures.py
- id: fig:overview
  file: output/figures/active_inference_overview.png
  section: extended
  caption: One Gaussian potential, two drift regimes, with equilibrium or NESS interpretation under matched diffusion.
  alt_text: 'Two-panel flow figure: pure gradient descent at equilibrium (left) and a solenoidal current on a non-equilibrium
    steady state (right) over the same Gaussian free-energy landscape.'
  builder: src/figures/overview.py
  script: scripts/generate_overview_figure.py
- id: fig:belief
  file: output/figures/belief_update.png
  section: generative-model
  caption: Perception as free-energy minimization — gradient descent on variational free energy drives beliefs to
    the Bayesian posterior.
  alt_text: 'Two-panel figure: a belief bar chart sharpening toward the posterior over descent steps (left) and
    variational free energy falling monotonically to the surprise it bounds (right).'
  builder: src/figures/belief.py
  script: scripts/generate_belief_update_figure.py
- id: fig:trajectories
  file: output/figures/worked_trajectories.png
  section: worked-regimes
  caption: Deterministic drift relaxes radially or spirals; persistent stationary probability current belongs to
    the corresponding matched-noise stochastic model.
  alt_text: Two-panel figure comparing an equilibrium trajectory that falls straight to the mode with a non-equilibrium
    trajectory that spirals, annotated with the accumulated rotation angle.
  builder: src/figures/trajectories_figure.py
  script: scripts/generate_trajectory_figure.py
- id: fig:efe
  file: output/figures/expected_free_energy.png
  section: expected-free-energy
  caption: Expected free energy over policies — the argmin-EFE rule yields exploration under flat preferences and
    exploitation under sharp preferences.
  alt_text: Figure contrast a 'cue' action with a 'bet' action across flat and sharp preferences, showing the same
    argmin-expected-free-energy rule flip from exploration to exploitation.
  builder: src/figures/efe.py
  script: scripts/generate_efe_figure.py
- id: fig:planning
  file: output/figures/policy_planning.png
  section: planning
  caption: Finite action-sequence scoring with terminal preference value and whole-history information; the state-independent
    bet has no adaptive payout advantage.
  alt_text: Bar chart of expected free energy over the four two-step policies (cue-cue, cue-bet, bet-cue, bet-bet)
    with pragmatic and epistemic annotations; cue-then-bet has the lowest G and is highlighted.
  builder: src/figures/policy_planning.py
  script: scripts/generate_policy_planning_figure.py
- id: fig:blanket
  file: output/figures/markov_blanket.png
  section: markov-blanket
  caption: 'Original Gaussian blanket and matched native canonical Gaussian: marginal dependence, conditional independence,
    and explicit carrier qualification.'
  alt_text: Three panels show original marginal correlations, original precision zeros, and the conditioned covariance
    of a separate canonical Gaussian with a native conditional-independence proof.
  builder: src/figures/blanket.py
  script: scripts/generate_markov_blanket_figure.py
- id: fig:steady
  file: output/figures/steady_state_current.png
  section: steady-state
  caption: The steady state, quantified — the NESS carries a divergence-free probability current at a positive entropy-production
    rate.
  alt_text: 'Two-panel figure over a stationary Gaussian density: at equilibrium the probability current is zero
    and entropy production vanishes; in the NESS a divergence-free current circulates at sigma > 0.'
  builder: src/figures/steady_state.py
  script: scripts/generate_steady_state_figure.py
- id: fig:agent
  file: output/figures/synthetic_agent.png
  section: synthetic-agent
  caption: Informative observations change the next action; an uninformative cue leaves the decision unchanged.
  alt_text: Informative observations change the next action; an uninformative cue leaves the decision unchanged.
  builder: src/figures/synthetic_agent.py
  script: scripts/generate_synthetic_agent_figure.py
- id: fig:hierarchy
  file: output/figures/hierarchical_inference.png
  section: hierarchy
  caption: A two-level categorical hierarchy predicts downward and updates both hidden levels from the same posterior
    joint.
  alt_text: A two-level categorical hierarchy predicts downward and updates both hidden levels from the same posterior
    joint.
  builder: src/figures/hierarchy.py
  script: scripts/generate_hierarchy_figure.py
- id: fig:decision-value
  file: output/figures/value_of_information.png
  section: decision-value
  caption: Exact finite feedback utility value, acquisition cost, and informative-but-irrelevant utility control.
  alt_text: Known cue accuracy sweeps utility gain and acquisition cost alongside mutual information in nats; state-independent utility has zero instrumental gain even when the cue is informative.
  builder: src/figures/decision_value.py
  script: scripts/generate_decision_value_figure.py
export:
  dpi: 300
