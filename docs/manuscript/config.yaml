paper:
  title: "Active Inference -- A Synthetic Overview"
  subtitle: "An executable introduction to Active Inference and synthetic intelligences across equilibrium and non-equilibrium settings"
  version: "0.5.0"
  date: "2026-10-12"
  cover:
    image: "output/figures/graphical_abstract.png"
    alt: "The same Gaussian density supports equilibrium with zero current or a non-equilibrium stationary circulation. A separate perception-action model connects inference and policy selection. GNN specifies, Synthetic computes, and FEP_Formal proves statements under explicit hypotheses."

