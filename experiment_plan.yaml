conditions:
  - name: equilibrium
    role: reference
    description: "Pure gradient descent on free energy (omega=0). Detailed balance holds; Q=0; the flow relaxes to the mode with no net probability current."
  - name: non_equilibrium_steady_state
    role: proposed
    description: "Same Gaussian free-energy landscape plus an antisymmetric solenoidal term (omega=2.4). Free energy is still minimised, but a persistent probability current circulates along the level sets of F."
metrics:
  primary:
    name: free_energy
    direction: minimize
protocol: "Evaluate the analytic Bayesian-mechanics flow f = (Q - Gamma) grad F over one shared isotropic Gaussian free-energy landscape for both the equilibrium (omega=0) and NESS (omega!=0) regimes. Everything is closed-form and deterministic: no RNG, no fitting, no iteration cap. The solenoidal term is verified orthogonal to grad F (does no work against free energy) to machine precision."
expected_figures:
  - fig:overview
baselines:
  - equilibrium
ablations:
  - non_equilibrium_steady_state
