# Code Project Configuration

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "active_inference_synthetic"
version = "0.5.0"
description = "Active Inference -- A Synthetic Overview: an applicable introduction across equilibrium and far-from-equilibrium systems"
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
keywords = ["active inference", "free energy principle", "Bayesian mechanics", "reproducible research"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
    {name = "Alexandra Mikhailova", email = "alexandra@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.urls]
"Source" = "https://github.com/docxology/ActiveInferenceSynthetic"
"Documentation" = "https://github.com/docxology/ActiveInferenceSynthetic/tree/main/docs"
"Issues" = "https://github.com/docxology/ActiveInferenceSynthetic/issues"
"Paper and archived distribution" = "https://zenodo.org/records/23396307"
"Formal reference" = "https://github.com/ActiveInferenceInstitute/fep_formal"
"Model specification reference" = "https://github.com/ActiveInferenceInstitute/Generalized_Notation_Notation"

[tool.setuptools]
packages = ["active_inference_synthetic", "active_inference_synthetic.figures"]

[tool.setuptools.package-dir]
active_inference_synthetic = "src"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff==0.15.21",
    "mypy==2.4.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
required-version = "==0.15.21"
target-version = "py310"
line-length = 88

[tool.ruff.lint.per-file-ignores]
# The thin figure scripts insert the project root on sys.path before importing
# `src.*`; that legitimate bootstrap must precede the imports (E402).
"scripts/*.py" = ["E402", "N999"]
