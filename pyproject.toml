# Code Project Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "active_inference_synthetic"
version = "0.5.0"
description = "Active Inference -- A Synthetic Overview: an applicable introduction across equilibrium and far-from-equilibrium systems"
readme = "README.md"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"},
    {name = "Alexandra Mikhailova", email = "alexandra@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.urls]
"Source" = "https://github.com/docxology/ActiveInferenceSynthetic"
"Formal reference" = "https://github.com/ActiveInferenceInstitute/fep_formal"
"Model specification reference" = "https://github.com/ActiveInferenceInstitute/Generalized_Notation_Notation"

[tool.setuptools]
packages = ["active_inference_synthetic", "active_inference_synthetic.figures"]

[tool.setuptools.package-dir]
active_inference_synthetic = "src"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
# RASP Strict Assertion: Tests must be clearly separated and structurally identifiable
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `--strict-markers` prevents typos in marker definitions
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
# Core Template Rule: We only calculate coverage for primary source code (`src/`),
# ensuring test code itself does not artificially inflate metric scores.
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
# ≥90% on src/ is the enforced gate; live coverage % is tracked in
# docs/_generated/COUNTS.md (do not hardcode it here — it drifts).
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.uv]
# Inherits workspace settings from root pyproject.toml

# Explicit local Ruff config. The project is a private sidecar that is also
# symlinked into the template checkout; pinning [tool.ruff] here makes the lint
# and format surface deterministic regardless of which directory Ruff resolves
# config from, instead of silently inheriting a 120-column / 88-column default.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.per-file-ignores]
# The thin figure scripts insert the project root on sys.path before importing
# `src.*`; that legitimate bootstrap must precede the imports (E402).
"scripts/*.py" = ["E402", "N999"]
